function useTyping(text, speed) {
  const [disp, setDisp] = useState("");
  const [done, setDone] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    setDisp(""); setDone(false);
    let i = 0;
    ref.current = setInterval(() => {
      i++;
      if (i <= text.length) { setDisp(text.slice(0, i)); if (i === text.length) { setDone(true); clearInterval(ref.current); } }
    }, speed);
    return () => clearInterval(ref.current);
  }, [text, speed]);
  const skip = useCallback(() => { clearInterval(ref.current); setDisp(text); setDone(true); }, [text]);
  return { disp, done, skip };
}

function App() {
  const [id, setId] = useState("n0");
  const [hist, setHist] = useState([]);
  const [vis, setVis] = useState(true);
  const node = S[id];
  const { disp, done, skip } = useTyping(node?.t || "", 24);

  const goto = (nid) => { setVis(false); setTimeout(() => { setHist(h=>[...h,id]); setId(nid); setVis(true); }, 400); };
  const restart = () => { setVis(false); setTimeout(() => { setId("n0"); setHist([]); setVis(true); }, 400); };
  const tap = () => { if (node.ch || node.ending) return; if (!done) { skip(); return; } if (node.n) goto(node.n); };

  if (!node) return null;
  const portrait = node.c && IMG[node.c] ? IMG[node.c] : null;
  const side = node.c ? SIDE[node.c] : null;
  const [mouth, setMouth] = useState(false);
  useEffect(() => {
    if (!portrait || done) { setMouth(false); return; }
    const iv = setInterval(() => setMouth(m => !m), 150);
    return () => clearInterval(iv);
  }, [id, portrait, done]);
  const frameSrc = portrait ? (mouth && !done ? portrait.o : portrait.c) : null;

  return (
    <div onClick={tap} style={{
      width:"100%", height:"100vh", background: BG[node.bg] || BG.home,
      transition:"opacity 0.4s, background 0.7s", opacity: vis ? 1 : 0,
      fontFamily:"'Georgia','Batang','NanumMyeongjo',serif",
      cursor:(node.ch||node.ending)?"default":"pointer",
      display:"flex", flexDirection:"column", justifyContent:"flex-end",
      position:"relative", overflow:"hidden", userSelect:"none",
    }}>
      <div style={{ position:"absolute",inset:0, background:"linear-gradient(0deg,rgba(0,0,0,0.72) 0%,rgba(0,0,0,0.15) 45%,rgba(0,0,0,0.3) 100%)", pointerEvents:"none", zIndex:5 }}/>

        <div style={{ position:"absolute",top:18,left:22, color:"rgba(220,195,160,0.5)", fontSize:"11px", letterSpacing:"0.22em", fontFamily:"sans-serif", zIndex:9 }}>
          {BG_LABEL[node.bg]}
        </div>
      )}
      {hist.length > 0 && (
        <button onClick={e=>{e.stopPropagation();restart();}} style={{
          position:"absolute",top:14,right:18, zIndex:9, background:"rgba(0,0,0,0.5)",
          border:"1px solid rgba(180,120,80,0.32)", color:"rgba(210,170,130,0.75)",
          padding:"5px 14px", fontSize:"11px", cursor:"pointer", letterSpacing:"0.14em", fontFamily:"sans-serif",
        }}>처음으로</button>
      )}

      <div style={{ position:"relative", zIndex:10, padding:"0 0 28px" }}>
        {portrait && (
          <div style={{ display:"flex", padding:"0 18px 0",
            justifyContent: side==="left"?"flex-start": side==="right"?"flex-end":"center" }}>
            <div style={{ position:"relative", display:"inline-block" }}>
              <div style={{ position:"absolute", left:"50%", bottom:0, transform:"translateX(-50%)",
                width:"126%", height:"104%",
                background:"radial-gradient(ellipse 68% 82% at 50% 64%, rgba(78,68,58,0.6) 0%, rgba(48,40,34,0.34) 48%, rgba(0,0,0,0) 76%)",
                pointerEvents:"none", zIndex:0 }}/>
              <img key={node.c+id} src={frameSrc} alt={node.c} style={{
                position:"relative", zIndex:1, display:"block",
                height:"34vh", maxHeight:"300px", objectFit:"contain",
                filter:"saturate(0.94) contrast(1.03) drop-shadow(0 4px 14px rgba(0,0,0,0.6))",
                animation:"fadein 0.45s ease", pointerEvents:"none",
              }}/>
            </div>
          </div>
        )}
        {node.c && (
          <div style={{ marginLeft:26, display:"inline-block", background:"rgba(8,5,3,0.92)",
            borderTop:`2px solid ${CC[node.c]||"#c0a060"}`, padding:"4px 18px 4px 12px",
            fontSize:"14px", color:CC[node.c]||"#e8c4a0", letterSpacing:"0.1em", fontWeight:"bold" }}>{node.c}</div>
        )}

        <div style={{ margin:"0 18px", background:"rgba(6,4,3,0.9)",
          border:"1px solid rgba(150,110,70,0.22)", padding:"18px 24px", minHeight:"92px", position:"relative",
          backdropFilter:"blur(1px)" }}>
          {node.title && (
            <div style={{ color: node.et==="A"?"#8ad19a": node.et==="D"?"#8ab4d8": node.et==="C"?"#9aa8b4":"#d8b878",
              fontSize:"19px", marginBottom:"12px", letterSpacing:"0.05em", fontWeight:"bold" }}>{node.title}</div>
          )}
          <p style={{ color:"#e8dccd", fontSize:"16px", lineHeight:"1.95", margin:0, whiteSpace:"pre-wrap" }}>
            {disp}{!done && <span style={{ opacity:0.55, animation:"blink 0.7s infinite" }}>▌</span>}
          </p>
          {done && !node.ch && !node.ending && (
            <div style={{ position:"absolute",bottom:9,right:17, color:"rgba(200,150,90,0.7)", fontSize:"15px", animation:"bob 1.3s infinite" }}>▼</div>
          )}
        </div>

        {done && node.ch && (
          <div style={{ margin:"9px 18px 0", display:"flex", flexDirection:"column", gap:"7px" }}>
            {node.ch.map((c,i) => (
              <button key={i} onClick={e=>{e.stopPropagation();goto(c.n);}}
                style={{ background:"rgba(8,5,4,0.93)", border:"1px solid rgba(190,130,80,0.4)",
                  color:"#ecd4ba", padding:"13px 20px", fontSize:"15px", cursor:"pointer",
                  textAlign:"left", letterSpacing:"0.03em", lineHeight:"1.65", fontFamily:"inherit", transition:"all 0.16s" }}
                onMouseEnter={e=>{e.currentTarget.style.background="rgba(120,70,28,0.3)";e.currentTarget.style.borderColor="rgba(220,150,80,0.8)";}}
                onMouseLeave={e=>{e.currentTarget.style.background="rgba(8,5,4,0.93)";e.currentTarget.style.borderColor="rgba(190,130,80,0.4)";}}
              >▷ {c.t}</button>
            ))}
          </div>
        )}

        {done && node.ending && (
          <div style={{ margin:"13px 18px 0", display:"flex", flexDirection:"column", alignItems:"center", gap:"11px" }}>
            <div style={{ color: node.et==="A"?"#8ad19a": node.et==="D"?"#8ab4d8": node.et==="C"?"#9aa8b4":"#d8b878",
              fontSize:"12px", letterSpacing:"0.28em", fontFamily:"sans-serif" }}>
              {node.et==="A"?"TRUE END":"ALT END"} · {node.et}

            <button onClick={e=>{e.stopPropagation();restart();}} style={{
              background:"transparent", border:"1px solid rgba(210,168,128,0.4)",
              color:"rgba(220,178,138,0.8)", padding:"9px 32px", fontSize:"12px",
              cursor:"pointer", letterSpacing:"0.24em", fontFamily:"sans-serif" }}>다시 시작</button>
          </div>
        )}
      </div>

      <style>{`
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
        @keyframes fadein{from{opacity:0}to{opacity:1}}
        button:active{opacity:0.7}
      `}</style>
    </div>
  );
}
